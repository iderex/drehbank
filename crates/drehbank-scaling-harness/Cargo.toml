[package]
name = "drehbank-scaling-harness"
description = "Scaling and measurement runs that need a real machine, not a gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "drehbank_scaling_harness"
path = "src/lib.rs"

[[bin]]
name = "drehbank-scaling-harness"
path = "src/main.rs"

# The kernel it measures and the index arithmetic its cost is computed from.
# Both are the workspace's own, so the graph a caller links is unmoved: the
# entry that says so is in docs/dependencies.md.
[dependencies]
drehbank-core = { path = "../drehbank-core" }

# The workspace decides the lint levels, so this crate cannot drift from the
# gate by keeping its own.
[lints]
workspace = true
