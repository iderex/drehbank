[package]
name = "drehbank-cli"
description = "The command line an operator runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "drehbank"
path = "src/main.rs"

[dependencies]
drehbank-core = { path = "../drehbank-core" }

# The workspace decides the lint levels, so this crate cannot drift from the
# gate by keeping its own.
[lints]
workspace = true
