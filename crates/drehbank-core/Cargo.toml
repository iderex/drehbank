[package]
name = "drehbank-core"
description = "Truncated series, Poisson brackets, Lie transforms, normal forms and remainder estimates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# None yet, and the first one is not free to choose: exact rational and
# arbitrary-precision integer arithmetic is wanted here, and the license of the
# crate that supplies it is an open entry in issue #2.
[dependencies]

# The workspace decides the lint levels, so this crate cannot drift from the
# gate by keeping its own.
[lints]
workspace = true

# Tests only. This is a dev-dependency, so nothing here is compiled into the
# library or the binary a caller links, and nothing here reaches a coefficient.
# The entry that argues it is in docs/dependencies.md.
#
# `default-features = false` with `std` back on is the whole graph question:
# the default set adds process forking, a timeout thread and a temporary file
# crate for persisting counterexamples, none of which this suite uses, and it
# costs fourteen more packages. Measured rather than supposed, with the command
# on the dependency page.
[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
