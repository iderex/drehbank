[workspace]
resolver = "3"
members = [
    "crates/drehbank-core",
    "crates/drehbank-cli",
    "crates/drehbank-scaling-harness",
]
# The scaling harness is a member, so `--workspace` compiles, formats and lints
# it, and it is out of the default set, so a plain `cargo build` and a plain
# `cargo test` never reach it. What it needs from a host, and how it announces a
# skip, is issue #51.
default-members = [
    "crates/drehbank-core",
    "crates/drehbank-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
# Nothing has been released, so nothing carries a release number yet. The
# versioning policy is issue #64.
version = "0.0.0"
# No package here states a license, because the license of this repository is
# the first open entry in issue #2 and no LICENSE file exists in the tree.
# Publishing to a registry is an entry in the same issue, so nothing is
# publishable until it is answered.
publish = false

# The lint levels live here and not in the workflow. `cargo clippy` reads this
# table, so the command a contributor runs and the command the gate runs select
# the same set without either of them carrying a flag. A level that lives in a
# workflow file is a level nobody can see from a red run on their own machine,
# and reproducing the failure then starts with reading YAML.
[workspace.lints.rust]
# The whole default set is an error rather than advice, which is the position
# the build gate already takes with RUSTFLAGS. Stating it here means the lint
# gate takes it too, on the members the default build never reaches.
warnings = "deny"
# The reason for choosing this language in 0001 was that a bounds mistake in
# index arithmetic is defined behaviour rather than undefined behaviour, and
# `unsafe` is where that stops being true. This is not a ban: a block that needs
# it carries `#[allow(unsafe_code)]` at the site with the argument next to it,
# so every one of them is a thing somebody wrote down. Lowering this line
# instead makes them invisible.
unsafe_code = "deny"

[workspace.lints.clippy]
# The default clippy set, at error. The priority puts the group below any
# single lint named after it, so a later exception is one line rather than a
# restructure.
all = { level = "deny", priority = -1 }

# The throughput path.
[profile.release]
opt-level = 3
# Off here and on in the test profile below. The two lines only make sense read
# together, so both are written rather than left to a default.
overflow-checks = false

# The suite. Index arithmetic into flat buffers is one of the two ways this
# package produces a plausible wrong number instead of a crash, and an arithmetic
# overflow in an index is that way exactly. Both checks that catch it are on.
[profile.test]
debug-assertions = true
overflow-checks = true
